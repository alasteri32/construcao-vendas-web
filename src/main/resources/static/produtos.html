<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Produtos - Construção Vendas</title>
<link rel="stylesheet" href="css/estilo.css">
</head>
<body data-pagina="produtos">
<header></header>
<main>
<div class="card"><h1>Cadastro de produtos</h1><div id="msg"></div>
<form novalidate>
<label>Nome<input name="nome"><span class="erro-campo"></span></label>
<label>Categoria<select name="categoria"><option>Construção</option><option>Elétrica</option><option>Hidráulica</option><option>Ferramentas</option></select><span class="erro-campo"></span></label>
<label>Preço (R$)<input name="preco" type="number" step="0.01"><span class="erro-campo"></span></label>
<label>Quantidade<input name="quantidade" type="number"><span class="erro-campo"></span></label>
<button>Cadastrar</button>
</form></div>
</main>
<script src="js/validacao.js"></script>
<script src="js/app.js"></script>
</body>
</html>
