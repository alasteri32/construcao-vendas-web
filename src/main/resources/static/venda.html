<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Venda - Construção Vendas</title>
<link rel="stylesheet" href="css/estilo.css">
</head>
<body data-pagina="venda">
<header></header>
<main>
<div class="card"><h1>Nova venda</h1><div id="msg"></div>
<form novalidate>
<label>Cliente<select name="cliente"></select><span class="erro-campo"></span></label>
<label>Produto<select name="produto"></select><span class="erro-campo"></span></label>
<label>Quantidade<input name="qtd" type="number" value="1"><span class="erro-campo"></span></label>
<button>Adicionar ao carrinho</button>
</form></div>
<div class="card"><div class="tabela"><table><thead><tr><th>Produto</th><th>Qtd</th><th>Subtotal</th><th></th></tr></thead><tbody id="corpo"></tbody></table></div>
<div class="total" id="total"></div><button id="finalizar" type="button">Finalizar venda</button></div>
</main>
<script src="js/validacao.js"></script>
<script src="js/app.js"></script>
</body>
</html>
