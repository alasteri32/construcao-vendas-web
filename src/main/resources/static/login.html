<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login - Construção Vendas</title>
<link rel="stylesheet" href="css/estilo.css">
</head>
<body data-pagina="login">
<header><b>Construção Vendas</b></header>
<main class="login card">
<h1>Entrar</h1>
<div id="msg"></div>
<form novalidate>
<label>Usuário<input name="usuario" autocomplete="username"><span class="erro-campo"></span></label>
<label>Senha<input name="senha" type="password" autocomplete="current-password"><span class="erro-campo"></span></label>
<button>Entrar</button>
</form>
<p><small>Demonstração: admin / 123</small></p>
</main>
<script src="js/validacao.js"></script>
<script src="js/app.js"></script>
</body>
</html>
